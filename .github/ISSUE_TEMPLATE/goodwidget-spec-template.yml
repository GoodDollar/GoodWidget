name: GoodWidget Spec Template
description: Define the requirements for a new GoodWidget
body:
  - type: textarea
    id: short_description
    attributes:
      label: Short description of the new GoodWidget
      description: |
        A short description of the new GoodWidget. This should be a concise summary of the widget's purpose and functionality.
      value: |
        A short description of the new GoodWidget. This should be a concise summary of the widget's purpose and functionality.
    validations:
      required: true

  - type: textarea
    id: repos_and_packages
    attributes:
      label: Repositories and packages in scope
      description: |
        List the repositories and packages the implementer should work with.
      value: |
        List the repositories and packages the implementer should work with.
    validations:
      required: true

  - type: textarea
    id: ui_implementation_reference
    attributes:
      label: UI implementation reference
      description: |
        Any of the following:

        - instruction to copy from another repo
        - provide screenshots
      value: |
        Any of the following:

        - instruction to copy from another repo
        - provide screenshots
    validations:
      required: true

  - type: textarea
    id: user_flows_states_behaviours
    attributes:
      label: User flows, states and behaviours
      description: |
        If no UI reference is given, elaborate how the UI/UX behaves.
        Any other UI/UX requirements for the implementer.
      value: |
        If no UI reference is given, elaborate how the UI/UX behaves.
        Any other UI/UX requirements for the implementer.
    validations:
      required: true

  - type: textarea
    id: create_the_plan
    attributes:
      label: Planning (when investigation or design decisions are needed)
      description: |
        Keep the planning decision in the issue body. A clear, approved issue can proceed without a separate plan.
      value: |
        ## Planning

        Follow AGENTS.md and obtain maintainer assignment or approval before starting work.
        If the request is clear enough to implement and verify, record that no separate plan is needed.
        If investigation or design decisions are needed, prepare a plan for maintainer review before implementation.

        When assigned to plan, create an execution plan in a **new sub-issue** and preserve the original issue content unchanged.
        Do not implement a draft plan or open a PR during the planning assignment. Wait for maintainer approval to implement.

        Sub-issue requirements:

        - Title format: `[DRAFT][PLAN] <what issue is being planned>`
        - Type: `Task`
        - Description must start with: `<sub-issue title>`
        - Link the sub-issue back to this parent issue.

        Instructions when creating the plan:

        - Map relevant files and references from the repositories in scope.
        - Agree with the bounty lead or maintainer how required SDK functionality ships with the widget, including any migration from https://github.com/GoodDollar/GoodSDKs.
        - Include both injected-wallet and Reown connection flows using the embed AppKit provider; report platform constraints for maintainer decision.
        - Identify reviewed UI/Tamagui components and presets.ts values to reuse; do not use components-test or direct react-native imports.
        - Include relevant Playwright tests and current, accurate output images; discuss recurring UX flows with the maintainer.
        - Map new components to the widget package; use packages/ui only for components reusable across widgets.

        Plan specification required sections:

        - Required states, flows, and behaviors
        - Execution plan
        - Acceptance criteria and verification commands
        - Human-reviewer checklist, including human or live QA when required
    validations:
      required: true

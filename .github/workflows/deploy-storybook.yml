name: Deploy Storybook

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Release commit to deploy (set by release-next)
        required: false
        type: string
  push:
    branches:
      - main
      - next
    paths:
      - 'examples/storybook/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request_target:
    types: [opened, synchronize, edited, ready_for_review]
    branches:
      - main
    paths:
      - 'examples/storybook/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: deploy-storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  guard-manual-branch:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Manual deployments are allowed only from main (Preview) or next (Production)." >&2
          exit 1

  # Fork PRs wait on the `external` environment, where maintainers configure
  # required reviewers. Internal PRs continue directly to their preview.
  authorize-preview:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    steps:
      - run: true

  preview:
    if: >-
      always() &&
      (
        (github.event_name == 'pull_request_target' && needs.authorize-preview.result == 'success') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    needs: authorize-preview
    runs-on: ubuntu-latest
    environment:
      name: preview-storybook
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: examples/storybook
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Pull Vercel project settings
        run: pnpm exec vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Storybook preview
        run: pnpm exec vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          url="$(pnpm exec vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  production:
    if: github.ref == 'refs/heads/next' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: examples/storybook
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Verify deployment commit belongs to next
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          git fetch origin next
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/next || {
            echo "Production deployments must use a commit reachable from next." >&2
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Pull Vercel project settings
        run: pnpm exec vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Storybook deployment
        run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        id: deploy
        run: |
          url="$(pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"

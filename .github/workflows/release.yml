name: Release packages

# Publishes the packages a push actually affects, in dependency order, and commits the
# resulting versions back to main. Version resolution reads the registry, so there is no
# changeset file to maintain and no package list to pick by hand.
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'packages/**'

permissions:
  contents: read

concurrency:
  # Never publish two releases at once; queue rather than cancel so no push is skipped.
  group: goodwidget-npm-release
  cancel-in-progress: false

jobs:
  release:
    # The release pushes its authoritative version commit back to main. The marker stops
    # that bot-authored push from starting another release.
    if: ${{ !contains(github.event.head_commit.message, '[goodwidget release]') }}
    permissions:
      contents: write
      id-token: write
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Configure pinned toolchain
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node --version
          pnpm --version
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Configure release identity
        run: |
          git config user.name goodwidget-release
          git config user.email goodwidget-release@users.noreply.github.com
      - name: Version, build, publish, and verify
        env:
          RELEASE_BASE_SHA: ${{ github.event.before }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm release:packages
